function ad(){const ib=(c,fn,p)=>`<button class="ib ${c}" onclick="${fn}">${ic(p)}</button>`;
return `<div class="fl"><span class="sub">ადმინისტრატორის რეჟიმი აქტიურია. ცვლილებები ინახება ღილაკით „შენახვა".</span><button onclick="lock()">გასვლა</button></div><div class="c"><div class="sh"><div><h2>ექსპორტი GitHub-ისთვის</h2><p>ჩამოტვირთავს index.html-ს ყველა ახლანდელი მონაცემით. ატვირთე GitHub-ზე ძველი ფაილის ნაცვლად.</p></div><button class="pr" onclick="exp()">${ic(P.p)} index.html-ის ჩამოტვირთვა</button></div></div>

<div class="c"><div class="sh"><div><h2>ვიდეო კონტენტი</h2><p>დაამატე ახალი ვიდეო ან შეცვალე და წაშალე არსებული</p></div><button class="pr" onclick="vf()">${ic(P.p)} ვიდეოს დამატება</button></div>${vd()}</div>
<div class="sh"><div><h2>კომპანიები და თვიური მაჩვენებლები</h2><p>სახელის შეცვლა, მაჩვენებლების რედაქტირება, დამატება და წაშლა</p></div><button class="pr" onclick="cof()">${ic(P.p)} კომპანიის დამატება</button></div>`+D.companies.map(c=>`<div class="c"><div class="sh"><input class="nm" value="${esc(c.name)}" onchange="D.companies.find(x=>x.id=='${c.id}').name=this.value;touch()"><button class="x" onclick="codel('${c.id}')">${ic(P.d)} წაშლა</button></div><div class="ov gi"><table><tr><th>მაჩვენებელი</th>${MS.map(m=>`<th>${m}</th>`).join('')}</tr>${MK.map(k=>`<tr><td>${MET[k]}</td>${c.monthly[k].map((x,i)=>`<td><input type="number" value="${x}" onchange="D.companies.find(x=>x.id=='${c.id}').monthly.${k}[${i}]=+this.value||0;touch()"></td>`).join('')}</tr>`).join('')}</table></div></div>`).join('')}

function form(t,fs,ok){const fi=x=>x[2]=='h'?`<h3 class="fh">${x[1]}</h3>`:`<div class="fi ${x[5]=='h'?'half':''}"><label>${x[1]}${x[6]?` <span class="sub">· ${x[6]}</span>`:''}</label>${x[2]=='s'?`<select id="f_${x[0]}">${x[4].map(o=>`<option value="${o[0]}" ${String(o[0])==String(x[3])?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input id="f_${x[0]}" type="${x[2]}" ${x[2]=='number'?'min="0" step="any" inputmode="decimal" placeholder="0"':''} value="${esc(x[3])}">`}</div>`;
$('#mdl').innerHTML=`<div class="md" onclick="if(event.target==this)this.remove()"><div><h2>${t}</h2><div class="fr">${fs.map(fi).join('')}</div><div id="fe" class="sub" style="color:var(--dn);min-height:18px;margin-top:10px"></div><div class="fl" style="margin:6px 0 0"><button class="pr" id="ok">შენახვა</button><button onclick="$('#mdl').innerHTML=''">გაუქმება</button></div></div></div>`;document.querySelectorAll('#mdl input').forEach(i=>i.onkeydown=e=>{if(e.key=='Enter')$('#ok').click()});$('#ok').onclick=()=>{const o={};fs.forEach(x=>{if(x[2]!='h')o[x[0]]=$('#f_'+x[0]).value});const r=ok(o);if(typeof r=='string')$('#fe').textContent=r;else if(r!==false)$('#mdl').innerHTML=''}}
function vf(id){const v=D.videos.find(x=>x.id==id)||{co:U.co||D.companies[0].id,cr:U.cr,m:U.m!==''?+U.m:new Date().getMonth(),t:'',v:'',e:'',c:'',w:'',l:'',n:''};
const S=[['v','ნახვები','სულ ნახვა'],['e','ჩართულობა','ჯამური ჩართულობა'],['c','კომენტარები','კომენტარების რაოდენობა'],['w','საშუალო ყურება (წმ)','საშუალო ყურების დრო წამებში']];
form(id?'ვიდეოს რედაქტირება':'ახალი ვიდეო',[[0,'ძირითადი ინფორმაცია','h'],['t','ვიდეოს სათაური','text',v.t,0,'','მაგ. თარიღი ან თემა'],['co','კომპანია','s',v.co,D.companies.map(c=>[c.id,c.name]),'h'],['cr','კრეატორი','s',v.cr,[['','—'],...D.creators.map(x=>[x,x])],'h'],['m','პერიოდი (თვე)','s',v.m,MF.map((m,i)=>[i,m])],[0,'სტატისტიკა','h'],...S.map(s=>[s[0],s[1],'number',v[s[0]],0,'h',s[2]]),[0,'დამატებითი','h'],['l','ვიდეოს ბმული','url',v.l],['n','შენიშვნა','text',v.n]],o=>{if(!o.t.trim())return 'შეიყვანე ვიდეოს სათაური';for(const s of S){const x=o[s[0]];if(x===''||isNaN(+x))return 'შეავსე სტატისტიკა: '+s[1];if(+x<0)return s[1]+' არ შეიძლება იყოს უარყოფითი'}const r={id:id||'v'+Date.now(),t:o.t.trim(),co:o.co,cr:o.cr,m:+o.m,v:Math.round(+o.v),e:Math.round(+o.e),c:Math.round(+o.c),w:+(+o.w).toFixed(1),l:o.l.trim(),n:o.n.trim()};if(id){adj({...v},-1);Object.assign(v,r);adj(v,1)}else{r.ap=1;adj(r,1);D.videos.push(r)}touch();render()})}
