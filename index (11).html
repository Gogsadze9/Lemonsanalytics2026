        c === 0x1160 ||
        c === 0x180e ||

  function locateQuote(text, q) {

      }
      var r = el.getBoundingClientRect();
      if (r.width === 0 && r.height === 0) {

        id: p.id,

    if (rafPending) return;
    rafPending = true;
    var done = false;
    function run() {
      if (done) return;
      done = true;

    // suspended entirely in hidden tabs and pins must still settle
    // when the tab becomes visible after background loading.
    requestAnimationFrame(run);

    mode = !!on;
    document.documentElement.toggleAttribute("data-cwhr-mode", mode);

    document.addEventListener("keyup", onSelCommit, true);

      if (ev.key === "Escape" && port) port.postMessage({ type: "dismiss" });

    // re-report its rect so the host's inspector box tracks it. Mutations
    // stay rects-only (animating pages would chatter the cursor stream).
    var textSelPending = false;
    function scheduleTextSel() {
      if (textSelPending) return;
      textSelPending = true;
      requestAnimationFrame(function () {
        textSelPending = false;
        reportTextSel(false);

      scheduleRects();

    window.addEventListener("scroll", onLayoutChange, true);
    window.addEventListener("resize", onLayoutChange);

    // animation doesn't fire the observer; JS writers at frame rate
    // would re-relocate every frame but are rare. characterData isn't
    // observed, so .data= edits leave highlights stale until the next
    // childList mutation.
    var observer = new MutationObserver(function () {
      quoteRanges = Object.create(null);
      scheduleRects();
      if (hasTextSel) scheduleTextSel();

    setInterval(scheduleRects, 2000);

    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }

$('#mdl').innerHTML=`<div class="md" onclick="if(event.target==this)this.remove()"><div><h2>${t}</h2><div class="fr">${fs.map(fi).join('')}</div><div id="fe" class="sub" style="color:var(--dn);min-height:18px;margin-top:10px"></div><div class="fl" style="margin:6px 0 0"><button class="pr" id="ok">შენახვა</button><button onclick="$('#mdl').innerHTML=''">გაუქმება</button></div></div></div>`;document.querySelectorAll('#mdl input').forEach(i=>i.onkeydown=e=>{if(e.key=='Enter')$('#ok').click()});$('#ok').onclick=()=>{const o={};fs.forEach(x=>{if(x[2]!='h')o[x[0]]=$('#f_'+x[0]).value});const r=ok(o);if(typeof r=='string')$('#fe').textContent=r;else if(r!==false)$('#mdl').innerHTML=''}}

function buildHtml(){const j=JSON.stringify(D).replace(/</g,'\\u003c');return SRC.replace(/(<script id="seed" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+j+b)}

if(dl){for(const n of ['index.html','index.html.txt']){try{await dl.save({filename:n,data:h});if(n!='index.html')note('ფაილი ჩამოიტვირთა როგორც index.html.txt. GitHub-ზე ატვირთვამდე სახელი გადაარქვი: index.html');return}catch(e){const c=e&&e.code;if(c=='declined')return;if(c!='rejected_extension'&&c!='extension_not_enabled')return note('ჩამოტვირთვა ვერ მოხერხდა: '+(c||''))}}return}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='index.html';a.click()}
async function pub(){const j=JSON.stringify(D).replace(/</g,'\\u003c');const h=SRC.replace(/(<script id="seed" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+j+b);if(!art){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='index.html';a.click();$('#bar').hidden=true;return note('ფაილი ჩამოიტვირთა. ატვირთე GitHub-ზე და ჩაანაცვლე index.html')}try{await art.publish(h)}catch(e){if(e&&e.code!='conflict')note('ვერ შეინახა: '+(e.message||e.code))}}
